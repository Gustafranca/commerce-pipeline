# Application UI and API. Airflow UI uses chart ingress (see k8s/helm/airflow-values-staging.yaml)
# on host airflow.pipeline-commerce.local. Add hosts to /etc/hosts or DNS for local dev.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pipeline-commerce-app
  namespace: pipeline-commerce
spec:
  ingressClassName: nginx
  rules:
    - host: app.pipeline-commerce.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /ingest
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /redoc
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
