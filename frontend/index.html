<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Commerce IA - Data Ingestion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-4xl mx-auto py-10 px-4" x-data="ingestionApp()">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800">Pipeline Commerce IA</h1>
            <p class="text-gray-600">Manual Data Ingestion Portal</p>
        </header>

        <main class="bg-white rounded-lg shadow-md p-6">
            <div class="mb-6">
                <label for="entity" class="block text-sm font-medium text-gray-700 mb-2">Select Entity Type</label>
                <select id="entity" x-model="selectedEntity" @change="updateFields()" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border">
                    <option value="">-- Choose an entity --</option>
                    <template x-for="entity in entities" :key="entity.id">
                        <option :value="entity.id" x-text="entity.label"></option>
                    </template>
                </select>
            </div>

            <div x-show="selectedEntity" x-cloak>
                <form @submit.prevent="submitData">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <template x-for="field in currentFields" :key="field">
                            <div>
                                <label :for="field" class="block text-xs font-semibold text-gray-500 uppercase mb-1" x-text="field.replace(/_/g, ' ')"></label>
                                <input type="text" :id="field" x-model="formData[field]" 
                                    class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border"
                                    :placeholder="'Enter ' + field.replace(/_/g, ' ')">
                            </div>
                        </template>
                    </div>

                    <div class="mt-8 flex justify-end">
                        <button type="submit" 
                            :disabled="submitting"
                            class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 flex items-center">
                            <span x-show="!submitting">Submit Record</span>
                            <span x-show="submitting" class="flex items-center">
                                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                                Processing...
                            </span>
                        </button>
                    </div>
                </form>
            </div>

            <div x-show="!selectedEntity" class="text-center py-12 text-gray-400">
                <p>Please select an entity type above to begin.</p>
            </div>
        </main>

        <!-- Notification -->
        <div x-show="notification.show" 
             x-cloak
             x-transition
             :class="notification.type === 'success' ? 'bg-green-100 border-green-400 text-green-700' : 'bg-red-100 border-red-400 text-red-700'"
             class="fixed bottom-4 right-4 border-l-4 p-4 rounded shadow-lg max-w-md">
            <div class="flex">
                <div class="flex-shrink-0">
                    <template x-if="notification.type === 'success'">
                        <svg class="h-5 w-5 text-green-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                    </template>
                    <template x-if="notification.type === 'error'">
                        <svg class="h-5 w-5 text-red-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg>
                    </template>
                </div>
                <div class="ml-3">
                    <p class="text-sm font-medium" x-text="notification.message"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function ingestionApp() {
            return {
                selectedEntity: '',
                formData: {},
                currentFields: [],
                submitting: false,
                notification: { show: false, message: '', type: 'success' },
                entities: [
                    { id: 'categorias_produto', label: 'Product Categories', fields: ['categoria_id', 'nome_categoria', 'status_categoria'] },
                    { id: 'clientes', label: 'Customers', fields: ['cliente_id', 'tipo_cliente', 'nome_razao_social', 'documento', 'email', 'telefone', 'cidade', 'uf', 'data_cadastro', 'data_nascimento', 'status_cliente'] },
                    { id: 'entregas', label: 'Deliveries', fields: ['entrega_id', 'pedido_id', 'transportadora', 'data_postagem', 'data_prevista', 'data_entrega_real', 'status_entrega', 'modalidade_frete'] },
                    { id: 'estoque_movimentacoes', label: 'Inventory Movements', fields: ['movimento_id', 'produto_id', 'loja_id', 'data_movimento', 'tipo_movimento', 'quantidade_movimentada', 'origem_movimento', 'sistema_origem'] },
                    { id: 'itens_pedido', label: 'Order Items', fields: ['item_pedido_id', 'pedido_id', 'sequencia_item', 'produto_id', 'quantidade', 'preco_unitario', 'desconto_item'] },
                    { id: 'lojas', label: 'Stores', fields: ['loja_id', 'nome_loja', 'cidade', 'uf', 'regiao', 'status_loja'] },
                    { id: 'pagamentos', label: 'Payments', fields: ['pagamento_id', 'pedido_id', 'metodo_pagamento', 'status_pagamento', 'data_pagamento', 'valor_pagamento', 'adquirente'] },
                    { id: 'pedidos', label: 'Orders', fields: ['pedido_id', 'pedido_codigo', 'cliente_id', 'vendedor_id', 'loja_id', 'data_pedido', 'canal_venda', 'status_pedido', 'valor_frete', 'valor_desconto', 'forma_pagamento_principal'] },
                    { id: 'produtos', label: 'Products', fields: ['produto_id', 'nome_produto', 'categoria_id', 'marca', 'custo_unitario', 'preco_unitario', 'status_produto'] },
                    { id: 'vendedores', label: 'Sellers', fields: ['vendedor_id', 'nome_vendedor', 'loja_id', 'data_admissao', 'nivel', 'status_vendedor'] }
                ],
                updateFields() {
                    const entity = this.entities.find(e => e.id === this.selectedEntity);
                    if (entity) {
                        this.currentFields = entity.fields;
                        this.formData = {};
                        entity.fields.forEach(f => this.formData[f] = '');
                    } else {
                        this.currentFields = [];
                    }
                },
                showNotification(message, type = 'success') {
                    this.notification = { show: true, message, type };
                    setTimeout(() => this.notification.show = false, 5000);
                },
                async submitData() {
                    this.submitting = true;
                    try {
                        const response = await fetch(`http://localhost:8000/ingest/${this.selectedEntity}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.formData)
                        });
                        
                        const result = await response.json();
                        
                        if (response.ok) {
                            this.showNotification(`Success! Record staged with Run ID: ${result.run_id}`);
                            this.formData = {};
                            this.updateFields();
                        } else {
                            this.showNotification(result.detail || 'Failed to ingest data', 'error');
                        }
                    } catch (error) {
                        this.showNotification('Network error or server unreachable', 'error');
                    } finally {
                        this.submitting = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
